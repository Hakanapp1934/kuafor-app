<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayarlar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="header">
        <i class="fa-solid fa-sliders"></i> Sistem Ayarları
    </div>
    
    <div class="container">
        <div id="syncStatus" style="text-align:center; font-size: 0.8rem; color: #6c757d; margin-bottom: 12px; font-weight:600;">
            <i class="fa-solid fa-arrows-rotate fa-spin"></i> Ayarlar Google Tablolar ile senkronize ediliyor...
        </div>

        <!-- Personel Yönetimi -->
        <div class="card">
            <div class="card-title"><i class="fa-solid fa-users"></i> Personel Listesi</div>
            <div style="display: flex; gap: 8px; margin-bottom: 15px;">
                <input type="text" id="newStylist" placeholder="Yeni personel adı...">
                <button class="btn" style="width: auto; padding: 0 18px;" onclick="addStylist()">Ekle</button>
            </div>
            <ul id="stylistList" style="list-style: none; padding: 0; margin: 0;"></ul>
        </div>

        <!-- Volüm / Oksidan Yönetimi -->
        <div class="card" style="margin-top: 20px;">
            <div class="card-title"><i class="fa-solid fa-vial"></i> Volüm / Oksidan Seçenekleri</div>
            <div style="display: flex; gap: 8px; margin-bottom: 15px;">
                <input type="text" id="newVolume" placeholder="Örn: 15 Vol (%4.5)...">
                <button class="btn" style="width: auto; padding: 0 18px;" onclick="addVolume()">Ekle</button>
            </div>
            <ul id="volumeList" style="list-style: none; padding: 0; margin: 0;"></ul>
        </div>
    </div>

    <!-- Alt Navigasyon Menüsü -->
    <div class="nav-bar">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-user-plus"></i>Kayıt Ekle</a>
        <a href="liste.html" class="nav-item"><i class="fa-solid fa-address-book"></i>Müşteriler</a>
        <a href="ayarlar.html" class="nav-item active"><i class="fa-solid fa-sliders"></i>Ayarlar</a>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxj3SX7iW7ruzD6hQ3sq2WIcIf6JTsAfMqw1hscgxm8sXd_DJLNeY0f0tWb0lHJq7IW/exec";

        window.onload = function() {
            renderLists();
            fetchSettingsFromGoogle();
        };

        function fetchSettingsFromGoogle() {
            const syncDiv = document.getElementById('syncStatus');
            syncDiv.style.display = 'block';

            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    if (data.stylists) localStorage.setItem('stylists', JSON.stringify(data.stylists));
                    if (data.volumes) localStorage.setItem('volumes', JSON.stringify(data.volumes));
                    renderLists();
                })
                .catch(err => console.error("Ayarlar çekilemedi:", err))
                .finally(() => {
                    syncDiv.style.display = 'none';
                });
        }

        function saveSettingsToGoogle() {
            const stylists = JSON.parse(localStorage.getItem('stylists')) || [];
            const volumes = JSON.parse(localStorage.getItem('volumes')) || [];

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    action: "saveSettings",
                    stylists: stylists,
                    volumes: volumes
                })
            });
        }

        function renderLists() {
            let stylists = JSON.parse(localStorage.getItem('stylists')) || ["Elif", "Ayşe", "Mehmet"];
            let volumes = JSON.parse(localStorage.getItem('volumes')) || ["10 Vol (%3)", "20 Vol (%6)", "30 Vol (%9)", "40 Vol (%12)", "Oksidansız"];

            // Personel Listesi
            const sUl = document.getElementById('stylistList');
            sUl.innerHTML = stylists.map((s, idx) => `
                <li style="display:flex; justify-content:space-between; align-items:center; padding: 10px 0; border-bottom: 1px solid #eee;">
                    <span style="font-weight:600; color:#333;">${s}</span>
                    <button onclick="removeStylist(${idx})" style="background:none; border:none; color:#dc3545; cursor:pointer; font-size:1rem;"><i class="fa-solid fa-trash-can"></i></button>
                </li>
            `).join('');

            // Volüm Listesi
            const vUl = document.getElementById('volumeList');
            vUl.innerHTML = volumes.map((v, idx) => `
                <li style="display:flex; justify-content:space-between; align-items:center; padding: 10px 0; border-bottom: 1px solid #eee;">
                    <span style="font-weight:600; color:#333;">${v}</span>
                    <button onclick="removeVolume(${idx})" style="background:none; border:none; color:#dc3545; cursor:pointer; font-size:1rem;"><i class="fa-solid fa-trash-can"></i></button>
                </li>
            `).join('');
        }

        function addStylist() {
            const input = document.getElementById('newStylist');
            const val = input.value.trim();
            if(!val) return;
            
            let stylists = JSON.parse(localStorage.getItem('stylists')) || [];
            stylists.push(val);
            localStorage.setItem('stylists', JSON.stringify(stylists));
            input.value = '';
            renderLists();
            saveSettingsToGoogle();
        }

        function removeStylist(idx) {
            let stylists = JSON.parse(localStorage.getItem('stylists')) || [];
            stylists.splice(idx, 1);
            localStorage.setItem('stylists', JSON.stringify(stylists));
            renderLists();
            saveSettingsToGoogle();
        }

        function addVolume() {
            const input = document.getElementById('newVolume');
            const val = input.value.trim();
            if(!val) return;

            let volumes = JSON.parse(localStorage.getItem('volumes')) || [];
            volumes.push(val);
            localStorage.setItem('volumes', JSON.stringify(volumes));
            input.value = '';
            renderLists();
            saveSettingsToGoogle();
        }

        function removeVolume(idx) {
            let volumes = JSON.parse(localStorage.getItem('volumes')) || [];
            volumes.splice(idx, 1);
            localStorage.setItem('volumes', JSON.stringify(volumes));
            renderLists();
            saveSettingsToGoogle();
        }
    </script>
</body>
</html>
