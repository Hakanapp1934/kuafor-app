<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Müşteri Listesi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sync-badge {
            text-align: center;
            font-size: 0.78rem;
            color: var(--secondary);
            margin-bottom: 12px;
            font-weight: 600;
        }
        /* Modal / Açılır Pencere Stilleri */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background: #fff;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-header {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 { margin: 0; font-size: 1rem; color: #333; }
        .modal-close {
            background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #888;
        }
        .modal-body {
            padding: 15px;
            overflow-y: auto;
        }
        .timeline-item {
            border-left: 3px solid #6c5ce7;
            padding-left: 12px;
            margin-bottom: 15px;
            position: relative;
            background: #f8f9fa;
            padding: 10px 12px;
            border-radius: 0 8px 8px 0;
        }
        .timeline-date {
            font-size: 0.78rem;
            color: #6c5ce7;
            font-weight: bold;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <i class="fa-solid fa-address-book"></i> Kayıtlı Müşteriler
    </div>
    
    <div class="container">
        <div id="syncStatus" class="sync-badge">
            <i class="fa-solid fa-arrows-rotate fa-spin"></i> Google Tablolar'dan veriler güncelleniyor...
        </div>

        <div style="position: relative; margin-bottom: 20px;">
            <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #adb5bd;"></i>
            <input type="text" id="search" placeholder="İsim, telefon veya marka ara..." onkeyup="loadList()" style="padding-left: 42px; border-radius: 25px;">
        </div>

        <div id="listContainer"></div>
    </div>

    <!-- Müşteri Geçmişi Açılır Penceresi (Modal) -->
    <div id="historyModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalTitle"><i class="fa-solid fa-clock-rotate-left"></i> İşlem Geçmişi</h3>
                <button class="modal-close" onclick="closeHistory()">&times;</button>
            </div>
            <div id="historyContainer" class="modal-body"></div>
        </div>
    </div>

    <!-- Alt Navigasyon Menüsü -->
    <div class="nav-bar">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-user-plus"></i>Kayıt Ekle</a>
        <a href="liste.html" class="nav-item active"><i class="fa-solid fa-address-book"></i>Müşteriler</a>
        <a href="ayarlar.html" class="nav-item"><i class="fa-solid fa-sliders"></i>Ayarlar</a>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwESaLY74wnh4brbKkdx4V7JRdk-KHlmJGhDfKKcdWrCiJ9z2Xoj_IUQDY0aTxZ7g_z/exec";

        window.onload = function() {
            loadList(); // Önce yerel hafızadakileri göster
            fetchDataFromGoogle(); // Google Tablolar'dan güncel veriyi çek
        };

        function fetchDataFromGoogle() {
            const syncDiv = document.getElementById('syncStatus');
            syncDiv.style.display = 'block';

            fetch(SCRIPT_URL)
                .then(response => response.json())
                .then(remoteData => {
                    let customerList = [];
                    if (Array.isArray(remoteData)) {
                        customerList = remoteData;
                    } else if (remoteData && Array.isArray(remoteData.customers)) {
                        customerList = remoteData.customers;
                        if (remoteData.stylists) localStorage.setItem('stylists', JSON.stringify(remoteData.stylists));
                        if (remoteData.volumes) localStorage.setItem('volumes', JSON.stringify(remoteData.volumes));
                    }

                    localStorage.setItem('customers', JSON.stringify(customerList));
                    loadList();
                })
                .catch(err => console.error("Google Tablolar Veri Çekme Hatası:", err))
                .finally(() => {
                    syncDiv.style.display = 'none';
                });
        }

        function loadList() {
            const query = document.getElementById('search').value.toLowerCase().trim();
            let customers = JSON.parse(localStorage.getItem('customers')) || [];
            const container = document.getElementById('listContainer');
            
            const filtered = customers.filter(c => 
                (c.name && String(c.name).toLowerCase().includes(query)) || 
                (c.phone && String(c.phone).includes(query)) ||
                (c.brand && String(c.brand).toLowerCase().includes(query)) ||
                (c.stylist && String(c.stylist).toLowerCase().includes(query))
            );
            
            if(filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 40px; color: #adb5bd;"><i class="fa-regular fa-folder-open" style="font-size: 2.5rem; margin-bottom: 10px; display:block;"></i>Kayıt bulunamadı.</div>`;
                return;
            }

            container.innerHTML = filtered.map(c => {
                const id = String(c.id || '').replace("'", "").trim();
                const name = c.name || 'İsimsiz Müşteri';
                const phone = c.phone || '-';
                const date = c.date || '-';
                const brand = c.brand || '-';
                const rootColor = c.rootColor || '-';
                const rootGram = c.rootGram || '-';
                const rootVolume = c.rootVolume || '-';
                const fullColor = c.fullColor || '-';
                const fullGram = c.fullGram || '-';
                const fullVolume = c.fullVolume || '-';
                const notes = c.notes || 'Not yok.';
                const stylist = c.stylist || '-';
                const waitTime = c.waitTime || '-';

                return `
                    <div class="customer-card">
                        <div class="customer-header">
                            <div>
                                <div class="customer-name">${name}</div>
                                <div class="customer-phone"><i class="fa-solid fa-phone" style="font-size:0.75rem;"></i> ${phone}</div>
                            </div>
                            <span class="customer-date"><i class="fa-regular fa-calendar"></i> ${date}</span>
                        </div>

                        <div style="font-size: 0.88rem; font-weight: 600; color: var(--secondary); margin-bottom: 6px;">
                            <i class="fa-solid fa-fill-drip"></i> Marka: ${brand}
                        </div>

                        <div class="formula-box">
                            <div>
                                <span class="badge badge-dip">Dip Boya</span><br>
                                <b>No:</b> ${rootColor}<br>
                                <b>Gram:</b> ${rootGram}<br>
                                <b>Vol:</b> ${rootVolume}
                            </div>
                            <div>
                                <span class="badge badge-komple">Komple Boya</span><br>
                                <b>No:</b> ${fullColor}<br>
                                <b>Gram:</b> ${fullGram}<br>
                                <b>Vol:</b> ${fullVolume}
                            </div>
                        </div>

                        <div style="font-size: 0.8rem; color: #495057; margin-bottom: 8px;">
                            <b><i class="fa-solid fa-note-sticky"></i> Not:</b> ${notes}
                        </div>

                        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; color: #6c757d; border-top: 1px dashed #e9ecef; padding-top: 8px;">
                            <span><i class="fa-solid fa-user-check"></i> Yapan: <b>${stylist}</b></span>
                            <span><i class="fa-solid fa-stopwatch"></i> Bekleme: <b>${waitTime} dk</b></span>
                        </div>

                        <div class="action-buttons" style="display: flex; gap: 6px; margin-top: 10px;">
                            <button class="btn-action" onclick="showHistory('${phone}', '${name}')" style="background:#6c5ce7; color:white;">
                                <i class="fa-solid fa-clock-rotate-left"></i> Geçmiş
                            </button>
                            <button class="btn-action btn-edit" onclick="editCustomer('${id}')">
                                <i class="fa-solid fa-pen-to-square"></i> Düzenle
                            </button>
                            <button class="btn-action btn-del" onclick="deleteCustomer('${id}')">
                                <i class="fa-solid fa-trash-can"></i> Sil
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showHistory(phone, name) {
            let customers = JSON.parse(localStorage.getItem('customers')) || [];
            const cleanPhone = String(phone).trim();
            const cleanName = String(name).toLowerCase().trim();

            // Müşteriyi telefon numarasına veya ismine göre eşleştirip tüm geçmişini çekiyoruz
            const history = customers.filter(c => {
                const cPhone = String(c.phone || '').trim();
                const cName = String(c.name || '').toLowerCase().trim();
                if (cleanPhone && cleanPhone !== '-') {
                    return cPhone === cleanPhone;
                }
                return cName === cleanName;
            });

            document.getElementById('modalTitle').innerText = `${name} - İşlem Geçmişi (${history.length} Kayıt)`;
            const container = document.getElementById('historyContainer');

            if (history.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 20px; color: #adb5bd;">Geçmiş işlem bulunamadı.</div>`;
            } else {
                container.innerHTML = history.map(c => `
                    <div class="timeline-item">
                        <div class="timeline-date">
                            <i class="fa-regular fa-calendar"></i> ${c.date || '-'} | <i class="fa-solid fa-user-check"></i> Yapan: ${c.stylist || '-'}
                        </div>
                        <div style="font-size:0.85rem; font-weight:bold; color:#333; margin-bottom: 4px;">
                            <i class="fa-solid fa-fill-drip"></i> Marka: ${c.brand || '-'}
                        </div>
                        <div style="font-size:0.8rem; color:#555; margin-bottom: 4px;">
                            <b>Dip:</b> ${c.rootColor || '-'} (${c.rootGram || '-'}g / ${c.rootVolume || '-'})<br>
                            <b>Komple:</b> ${c.fullColor || '-'} (${c.fullGram || '-'}g / ${c.fullVolume || '-'})
                        </div>
                        <div style="font-size:0.75rem; color:#6c757d;">
                            <b>Bekleme:</b> ${c.waitTime || '-'} dk | <b>Not:</b> ${c.notes || 'Yok'}
                        </div>
                    </div>
                `).join('');
            }

            document.getElementById('historyModal').classList.add('active');
        }

        function closeHistory() {
            document.getElementById('historyModal').classList.remove('active');
        }

        function editCustomer(id) {
            let customers = JSON.parse(localStorage.getItem('customers')) || [];
            const cleanTargetId = String(id).replace("'", "").trim();
            const customer = customers.find(c => String(c.id).replace("'", "").trim() === cleanTargetId);
            if(customer) {
                localStorage.setItem('editCustomer', JSON.stringify(customer));
                window.location.href = 'index.html';
            }
        }

        function deleteCustomer(id) {
            if(confirm("Bu müşteri kaydını silmek istediğinize emin misiniz?")) {
                let customers = JSON.parse(localStorage.getItem('customers')) || [];
                const cleanTargetId = String(id).replace("'", "").trim();
                
                customers = customers.filter(c => String(c.id).replace("'", "").trim() !== cleanTargetId);
                localStorage.setItem('customers', JSON.stringify(customers));
                loadList();

                fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id: cleanTargetId, action: "delete" })
                }).catch(err => console.error("Silme hatası:", err));
            }
        }
    </script>
</body>
</html>
